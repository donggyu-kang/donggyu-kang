name: GitHub 3D Contribution Graph

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: donggyu-kang
      - name: Convert SVG to PNG
        run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1280 profile-3d-contrib/profile-customize.svg -o profile-3d-contrib/profile-3d.png
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update 3D contribution graph"
          git pull --rebase origin main
          git push
