name: GitHub 3D Contribution Graph

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: donggyu-kang
      - name: Make night-rainbow background transparent
        run: |
          sed -i 's/width="1280" height="850" fill="#00000f"/width="1280" height="850" fill="none"/' profile-3d-contrib/profile-night-rainbow.svg
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update 3D contribution graph"
          git pull --rebase origin main
          git push
