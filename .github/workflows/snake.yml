name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: donggyu-kang
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#10B981&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?color_snake=#10B981&color_dots=#0d1117,#0e4429,#006d32,#26a641,#39d353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        run: |
          mkdir /tmp/snake-output
          cp dist/* /tmp/snake-output/
          cd /tmp/snake-output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update snake animation"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/donggyu-kang/donggyu-kang.git" \
            HEAD:output
