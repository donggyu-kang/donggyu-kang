<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="1080" cy="40" r="320" fill="url(#glow)">
      <animate attributeName="r" values="300;340;300" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="360" r="260" fill="url(#glow2)">
      <animate attributeName="r" values="240;280;240" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Left: identity -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.1s" fill="freeze"/>
    <text x="72" y="108" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="17" fill="#10b981" letter-spacing="1">// spring backend engineer</text>
    <text x="72" y="178" font-size="62" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Kang DongGyu</text>
    <rect x="74" y="200" width="120" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" from="0" to="120" dur="0.9s" begin="0.6s" fill="freeze"/>
    </rect>
    <text x="72" y="244" font-size="21" fill="#cbd5e1" font-weight="500">Spring Boot · JPA · MySQL · AWS</text>
    <text x="72" y="278" font-size="16" fill="#64748b">From domain design to deployment — building servers that stay reliable.</text>
  </g>

  <!-- Right: code card -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.5s" fill="freeze"/>
    <rect x="700" y="50" width="448" height="242" rx="14" fill="#0b1220" fill-opacity="0.88" stroke="#1e293b"/>
    <circle cx="726" cy="74" r="6" fill="#ef4444"/>
    <circle cx="746" cy="74" r="6" fill="#f59e0b"/>
    <circle cx="766" cy="74" r="6" fill="#22c55e"/>
    <text x="924" y="79" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#475569" text-anchor="middle">DongGyu.java</text>
    <line x1="700" y1="94" x2="1148" y2="94" stroke="#1e293b"/>
    <g font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="14.5">
      <text x="722" y="124"><tspan fill="#facc15">@Service</tspan></text>
      <text x="722" y="149"><tspan fill="#c084fc">public class </tspan><tspan fill="#5eead4">DongGyu</tspan><tspan fill="#e2e8f0"> {</tspan></text>
      <text x="722" y="179"><tspan fill="#e2e8f0">    </tspan><tspan fill="#5eead4">String</tspan><tspan fill="#e2e8f0"> api   = </tspan><tspan fill="#86efac">"REST API · Domain Design"</tspan><tspan fill="#e2e8f0">;</tspan></text>
      <text x="722" y="204"><tspan fill="#e2e8f0">    </tspan><tspan fill="#5eead4">String</tspan><tspan fill="#e2e8f0"> auth  = </tspan><tspan fill="#86efac">"OAuth2 · JWT · Security"</tspan><tspan fill="#e2e8f0">;</tspan></text>
      <text x="722" y="229"><tspan fill="#e2e8f0">    </tspan><tspan fill="#5eead4">String</tspan><tspan fill="#e2e8f0"> data  = </tspan><tspan fill="#86efac">"JPA · MySQL · Schema"</tspan><tspan fill="#e2e8f0">;</tspan></text>
      <text x="722" y="254"><tspan fill="#e2e8f0">    </tspan><tspan fill="#5eead4">String</tspan><tspan fill="#e2e8f0"> infra = </tspan><tspan fill="#86efac">"Docker · AWS · Actions"</tspan><tspan fill="#e2e8f0">;</tspan></text>
      <text x="722" y="279"><tspan fill="#e2e8f0">}</tspan></text>
      <rect x="738" y="267" width="9" height="16" fill="#10b981">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
